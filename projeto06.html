<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="projeto06.js" defer></script>

    <title>Juros Simples e Composto</title>
</head>
<body>
    <h1>Calcular Montante sobre Capital</h1>

    <label for="capital">Digite o Capital:</label>
    <input type="number" id="capital" step="any">

    <label for="juros">Digite o Juros(%):</label>
    <input type="number" id="juros" step="any">

    <label for="tempo">Digite o Tempo(meses):</label>
    <input type="number" id="tempo" step="any">

    <button id="calcular" type="button">Calcular</button>

    <div id="resultado"></div>

    <a href="index.html">Início</a>
</body>
